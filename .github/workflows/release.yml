# Everything a release touches, from the version bump to the upload.
#
# The trigger is a push to main rather than a tag, and that is not a preference.
# release-please creates the tag with the default GITHUB_TOKEN, and GitHub does
# not start workflows from events that token raises. A `push: tags` listener
# would sit silent through every release; v2.0.0 only reached PyPI because the
# tag was deleted and pushed again by hand.
#
# So the release is driven off release-please's own release_created output, the
# shape it documents, and no long-lived PAT enters the picture.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # main skips CI, so the gate lives here. A release must not go out on code that
  # was never run, and a direct push to main would otherwise reach the publish
  # job having been checked by nothing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: Test
        run: uv run --extra dev pytest -q

      - name: Lint
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

  release-please:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

  # release-please tags the very commit this run is building, so a plain checkout
  # is already at the released code. Nothing reads the tag name into a ref.
  #
  # The tag-versus-pyproject guard the hand-tagged repositories carry is absent
  # on purpose: release-please writes both numbers from one source and they
  # cannot drift apart.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # PyPI Trusted Publishing: the job mints an OIDC token that PyPI exchanges for
  # a short-lived upload token, so there is no API token in Secrets to leak or
  # rotate. id-token: write is what allows the mint and the only permission here.
  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
