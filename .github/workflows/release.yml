# Publishes to PyPI when a version tag is pushed.
#
# Authentication is PyPI Trusted Publishing: the job mints an OIDC token that
# PyPI exchanges for a short-lived upload token, so there is no API token in
# GitHub Secrets to leak or rotate. `id-token: write` is what allows that mint
# and is the only permission the publish job holds.
#
# The tag is the trigger and the version lives in pyproject.toml, so the two can
# disagree. The guard below refuses that rather than shipping a wheel whose
# version nobody asked for, since PyPI will not let the number be reused.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: tag matches pyproject version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          project="$(uv version --short)"
          tag="${REF_NAME#v}"
          if [[ "${project}" != "${tag}" ]]; then
            echo "tag ${tag} does not match pyproject version ${project}" >&2
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
