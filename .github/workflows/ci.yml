name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Use prod env on main, preprod otherwise
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'preprod' }}
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'preprod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      # `uv run` resolves against uv.lock, so the ruff CI enforces is the ruff
      # declared here. The previous steps ran `uv pip install ruff` unpinned
      # against a project that configured no rules, which made the verdict a
      # function of the calendar: green in February, 75 errors in August with no
      # commit in between.
      - name: Test
        run: uv run --extra dev pytest -q

      - name: Lint
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

  # release-please owns the version and the tag here, which is why publishing
  # hangs off its output instead of a tag trigger. A tag pushed by the default
  # GITHUB_TOKEN does not start a workflow (GitHub's recursion guard), so a
  # release.yml listening on `push: tags` would sit silent through every release.
  # v2.0.0 shipped only because the tag was re-pushed by hand.
  release-please:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

  # release-please tags the very commit this run is building, so a plain checkout
  # is already at the released code. No ref is taken from an output, which keeps
  # the tag name out of anything that resolves a revision.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Authentication is PyPI Trusted Publishing: the job mints an OIDC token that
  # PyPI exchanges for a short-lived upload token, so there is no API token in
  # Secrets to leak or rotate. id-token: write is what allows the mint and the
  # only permission this job holds.
  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

