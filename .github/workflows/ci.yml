# Format, lint, tests, dependency policy and a packaging dry run for pull
# requests and side branches, on the two operating systems awspick ships for.
#
# main is deliberately absent: release-please.yml runs the same checks there
# as the gate in front of a release, so covering main here too would run every
# test twice per push for no extra signal.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No Windows: awspick edits bash/zsh/fish rc files and prints POSIX or
        # fish syntax, and its shell detection relies on $SHELL and ps.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner images ship rustup; no third-party toolchain action needed.
      - name: install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Publishing problems show up here instead of on release day.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo publish --dry-run --locked
