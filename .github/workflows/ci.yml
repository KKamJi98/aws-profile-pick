# Tests and lint for pull requests and side branches.
#
# main is deliberately absent: release.yml runs the same checks there as the gate
# in front of releasing, so covering main here too would run every test twice per
# push for no extra signal.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'

      # `uv run` resolves against uv.lock, so the ruff CI enforces is the ruff
      # declared here. The previous steps ran `uv pip install ruff` unpinned
      # against a project that configured no rules, which made the verdict a
      # function of the calendar: green in February, 75 errors in August with no
      # commit in between.
      - name: Test
        run: uv run --extra dev pytest -q

      - name: Lint
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .
