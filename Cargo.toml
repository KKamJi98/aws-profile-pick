[package]
name = "awspick"
# release-please owns this number (release-type: rust). It bumps Cargo.toml
# and Cargo.lock together in the release PR; do not edit it by hand.
version = "3.0.1"
edition = "2024"
rust-version = "1.88"
description = "Pick an AWS profile from ~/.aws/config and set AWS_PROFILE in your shell"
license = "MIT"
repository = "https://github.com/KKamJi98/aws-profile-pick"
homepage = "https://github.com/KKamJi98/aws-profile-pick"
readme = "README.md"
keywords = ["aws", "profile", "cli", "shell"]
categories = ["command-line-utilities"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = "3.5.2"
fancy-regex = "0.20.0"
regex = "1.13.1"
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
