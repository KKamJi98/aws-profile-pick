[project]
name = "aws-profile-pick"
version = "2.0.1"
description = "A simple CLI tool to easily switch between AWS profiles in your shell environment"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kkamji", email = "kkamji@example.com" }
]
repository = "https://github.com/kkamji/aws-pick"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.28.0,<2.0.0",
    "rich>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.14,<0.15",
]

# PyPI shows no way back to the source without these. The project page carried a
# summary and nothing else: no repository, no issue tracker.
[project.urls]
Homepage = "https://github.com/KKamJi98/aws-profile-pick"
Source = "https://github.com/KKamJi98/aws-profile-pick"
Issues = "https://github.com/KKamJi98/aws-profile-pick/issues"
Changelog = "https://github.com/KKamJi98/aws-profile-pick/releases"

[project.scripts]
awspick = "awspick.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is aws-profile-pick and the import package is awspick, so
# hatchling's name-matching heuristic finds nothing. aws-pick was taken on PyPI
# by an unrelated tool and every separator variant normalises onto it, so the
# distribution had to move while the command stayed put.
[tool.hatch.build.targets.wheel]
packages = ["awspick"]



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# ruff replaces the black and isort pair that used to be declared here and never
# ran in CI. The rule set is written out rather than left to the default: CI used
# to `uv pip install ruff` unpinned against a project that configured nothing, so
# a ruff release could turn a green build red with no commit in between. That is
# what happened between February and August.
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
