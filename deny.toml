# cargo-deny policy, checked in CI (.github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build unless it is listed here with a reason.
ignore = []

[licenses]
# Permissive licenses only; the binary ships under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
